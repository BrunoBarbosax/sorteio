# ============================================================
# GORJETA 77 LUKAS - Build automatico na Netlify via GitHub
#
# fluxo:  git push  ->  Netlify roda "npm run netlify:ci"
#         ->  gera netlify-dist/ (site + funcao + migracoes)
#         ->  publica e atualiza o site
#
# Apos conectar o repositorio no Netlify, configure as variaveis
# de ambiente (Site configuration > Environment variables):
#   DATABASE_URL, DB_CLIENT=postgres, NODE_ENV=production,
#   TRUST_PROXY=1, PUBLIC_ORIGIN, ADMIN_EMAIL, ADMIN_PASSWORD
# ============================================================

[build]
  command = "npm run netlify:ci"
  publish = "netlify-dist"
  functions = "netlify-dist/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"
  DB_CLIENT = "postgres"
  TRUST_PROXY = "1"
  PUBLIC_ORIGIN = "https://gorjeta77.netlify.app"
  ADMIN_NAME = "Administrador"
  # Segredos (DATABASE_URL, ADMIN_EMAIL, ADMIN_PASSWORD) ficam no painel:
  # Site configuration > Environment variables

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
